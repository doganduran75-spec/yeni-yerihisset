<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<meta name="robots" content="noindex">
<title>Kısa bir bakım — YeriHisset</title>
<!--
  BAKIM SAYFASI — Caddy, site (pm2) yanıt vermediğinde (502/503/504) bunu gösterir:
  deploy sırasında derleme süresince ya da süreç çökerse. 5 sn'de bir kendini yeniler;
  site açılınca ziyaretçi kaldığı sayfaya döner. Dış dosya kullanmaz (site kapalıyken de açılır).
  Caddy ayarı: docs/BAKIM-SAYFASI.md
-->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 420px; width: 100%; background: #fff; border-radius: 28px; padding: 36px 28px; text-align: center; box-shadow: 0 20px 50px -20px rgba(15, 23, 42, .25); }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: -1px; color: #4d7c0f; margin-bottom: 22px; }
  .logo span { color: #0f172a; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 8px; }
  .dots { display: inline-flex; gap: 6px; margin-top: 18px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #84cc16; animation: b 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  small { display: block; margin-top: 16px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">Yeri<span>Hisset</span></div>
      <h1>Kısa bir bakım yapıyoruz</h1>
      <p>Siteyi birkaç dakikalığına güncelliyoruz. Bu sayfa kendiliğinden yenilenecek; hazır olunca kaldığın yere döneceksin.</p>
      <p>Sepetindeki ürünler kaybolmaz.</p>
      <div class="dots"><i></i><i></i><i></i></div>
      <small>Birkaç saniyede bir yeniden deneniyor…</small>
    </div>
  </div>
</body>
</html>
